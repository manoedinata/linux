%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/samsung,exynos7570-cmu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos7570 SoC clock controller

maintainers:
  - Hendra Manudinata <manoedinata@gmail.com>

description: |
  Exynos7570 clock controller is comprised of several CMU units, generating
  clocks for different domains. Those CMU units are modeled as separate device
  tree nodes, and might depend on each other. The root clock in that root tree
  is an external clock: OSCCLK (26 MHz). This external clock must be defined
  as a fixed-rate clock in dts.

  Each clock is assigned an identifier and client nodes can use this identifier
  to specify the clock which they consume. All clocks available for usage
  in clock consumer nodes are defined as preprocessor macros in
  include/dt-bindings/clock/samsung,exynos7570-cmu.h header.

properties:
  compatible:
    enum:
      - samsung,exynos7570-cmu-mif
      - samsung,exynos7570-cmu-fsys
      - samsung,exynos7570-cmu-peri

  clocks:
    items:
      - description: External reference clock (26 MHz)

  clock-names:
    items:
      - const: oscclk

  "#clock-cells":
    const: 1

  reg:
    maxItems: 1

required:
  - compatible
  - clocks
  - clock-names
  - "#clock-cells"
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/samsung,exynos7570-cmu.h>

    cmu_mif: clock-controller@10460000 {
        compatible = "samsung,exynos7570-cmu-mif";
        reg = <0x10460000 0x1000>;
        #clock-cells = <1>;

        clock-names = "oscclk";
        clocks = <&oscclk>;
    };
