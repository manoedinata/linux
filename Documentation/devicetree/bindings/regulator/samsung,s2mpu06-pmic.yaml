%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/samsung,s2mpu06-pmic.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MPU06 PMIC

maintainers:
  - Hendra Manudinata <manoedinata@gmail.com>

description:
  The S2MPU06 is a PMIC with three bucks and twenty LDOs, a power key and
  more, reached over the SPEEDY bus of the Exynos7570. Regulators not
  listed in the regulators node are left as the bootloader configured them.

properties:
  compatible:
    const: samsung,s2mpu06-pmic

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: Level-low interrupt line shared by all functions of the PMIC.

  monitored-battery:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Battery described by a simple-battery node, used by the fuel gauge.

  extcon:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    maxItems: 1
    description:
      MUIC whose cable detection sets the input and charge current of the
      charger.

  io-channels:
    maxItems: 1
    description: ADC channel the battery thermistor is wired to.

  io-channel-names:
    const: adc-temp

  samsung,temp-adc-table:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 2
    maxItems: 64
    description: Raw ADC values of the thermistor lookup table, ascending.

  samsung,temp-decidegc-table:
    $ref: /schemas/types.yaml#/definitions/int32-array
    minItems: 2
    maxItems: 64
    description:
      Battery temperature in tenths of a degree Celsius for each value of
      samsung,temp-adc-table.

  samsung,capacity-max:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 1000
    description:
      Gauge reading, in tenths of a percent, that counts as 100 % of the
      capacity before the scale is stretched at the end of a charge.

  samsung,capacity-max-margin:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 0
    description:
      How far, in tenths of a percent, samsung,capacity-max may be adapted.

  samsung,fuel-alert-soc:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 15
    default: 1
    description: Capacity in percent below which the gauge raises its low-battery alert.

  samsung,age-cycles:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 8
    description: Charge cycle count from which each ageing step applies, ascending.

  samsung,age-float-microvolt:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    minItems: 1
    maxItems: 8
    items:
      maxItems: 1
    description: Charge float voltage of each ageing step.

  samsung,age-raw100-millivolt:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 8
    description: Battery voltage at which the gauge reads 100 % in each ageing step.

  samsung,cell-character0:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: The 164 bytes of cell characteristics (gauge registers 0x34..0xd7) of every step.

  samsung,cell-character1:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: The 5 bytes of cell characteristics (gauge registers 0x0f..0x13) of every step.

  regulators:
    type: object
    description: Regulator nodes named after the rails.

    patternProperties:
      "^(LDO([1-8]|1[3-9]|2[0-4])|BUCK[1-3])$":
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false

    additionalProperties: false

required:
  - compatible
  - reg
  - interrupts
  - regulators

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    pmic@0 {
        compatible = "samsung,s2mpu06-pmic";
        reg = <0>;
        interrupt-parent = <&gpa0>;
        interrupts = <5 IRQ_TYPE_LEVEL_LOW>;
        monitored-battery = <&battery>;

        regulators {
            BUCK1 {
                regulator-name = "BUCK1";
                regulator-min-microvolt = <500000>;
                regulator-max-microvolt = <1300000>;
                regulator-always-on;
            };

            LDO14 {
                regulator-name = "vemmc";
                regulator-min-microvolt = <1800000>;
                regulator-max-microvolt = <3375000>;
            };
        };
    };
