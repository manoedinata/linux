%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/proximity/sharp,gp2ap070s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sharp GP2AP070S proximity sensor

maintainers:
  - Hendra Manudinata <manoedinata@gmail.com>

description:
  I2C proximity sensor with its own IR LED. The interrupt line follows the
  near/far state the chip keeps with its threshold hysteresis.

allOf:
  - $ref: /schemas/iio/iio.yaml#

properties:
  compatible:
    const: sharp,gp2ap070s

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vdd-supply: true

  proximity-near-level: true

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        proximity@39 {
            compatible = "sharp,gp2ap070s";
            reg = <0x39>;
            interrupt-parent = <&gpa1>;
            interrupts = <0 IRQ_TYPE_EDGE_BOTH>;
            vdd-supply = <&ldo22_reg>;
            proximity-near-level = <110>;
        };
    };
